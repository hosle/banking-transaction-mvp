apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-transactions
  labels:
    app.kubernetes.io/name: banking-transactions
spec:
  # H2 is in memory, so replicas must remain at one until durable shared storage is introduced.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-transactions
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-transactions
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: banking-transactions:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: temporary-files
          emptyDir: {}
