spring:
  application:
    name: banking-transaction-application
  datasource:
    url: jdbc:h2:mem:banking;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  transaction:
    supported-currencies: SGD,CNY,USD,HKD
  seed:
    enabled: true
